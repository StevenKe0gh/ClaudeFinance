name: paper-trail

on:
  push:
    paths:
      - "paper-trail/**"
      - ".github/workflows/paper-trail.yml"
  pull_request:
    paths:
      - "paper-trail/**"
      - ".github/workflows/paper-trail.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper-trail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paper-trail/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Built artifact is up to date
        run: npm run check
