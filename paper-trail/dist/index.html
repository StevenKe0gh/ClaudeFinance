<title>Paper Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>/* Layout: an operations console. Fixed command bar, icon rail, scrolling
   work area of hairline-ruled panels, status bar. Dense 13px UI with mono
   figures. Single dark theme by design: this is a tool for long sessions. */
:root {
  color-scheme: dark;

  /* Surfaces, darkest to lightest. Slight blue bias, matched to the accent. */
  --bg-0: #090C10;
  --bg-1: #0F141A;
  --bg-2: #131A22;
  --bg-3: #18212B;
  --bg-4: #1F2A36;
  --line: #222D38;
  --line-2: #19212A;
  --line-3: #2F3C4A;

  /* Ink */
  --fg-0: #E4EAF0;
  --fg-1: #B3BFCB;
  --fg-2: #8593A2;
  --fg-3: #5E6A77;

  /* Accent and semantic */
  --accent: #4C8DFF;
  --accent-hi: #7DABFF;
  --accent-bg: rgba(76, 141, 255, .13);
  --accent-line: rgba(76, 141, 255, .42);
  --on-accent: #05101F;
  --buy: #1FA874;
  --buy-bg: rgba(31, 168, 116, .14);
  --sell: #F0563F;
  --sell-bg: rgba(240, 86, 63, .14);
  --warn: #D9A13B;
  --warn-bg: rgba(217, 161, 59, .13);
  --info: #8C9CB0;
  --info-bg: rgba(140, 156, 176, .12);

  /* Entities (validated for CVD on --bg-1). Teal = insiders, amber = Congress everywhere. */
  --ent-ticker: #4C8DFF;
  --ent-member: #C98420;
  --ent-insider: #1F9E90;
  --ent-fund: #8C6CF0;
  --grp-insider: var(--ent-insider);
  --grp-congress: var(--ent-member);
  --grp-cross: var(--ent-fund);

  /* Type */
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-cond: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --f-mark: "Archivo", "Arial Black", "IBM Plex Sans", sans-serif;
  --t-xs: 11px;
  --t-sm: 12px;
  --t-md: 13px;
  --t-lg: 15px;
  --t-xl: 20px;
  --t-xxl: 30px;

  /* Geometry */
  --r: 4px;
  --top: 44px;
  --rail: 56px;
  --status: 26px;
  --gap: 12px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg-0);
  color: var(--fg-0);
  font: 400 var(--t-md)/1.45 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
a { color: var(--accent-hi); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: var(--accent-bg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
.mono, .num, td.num, th.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.dim { color: var(--fg-3); }
.small { font-size: var(--t-sm); }
.xs { font-size: var(--t-xs); }
.nowrap { white-space: nowrap; }
.label {
  font: 600 var(--t-xs)/1.2 var(--f-cond);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--fg-2);
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
* { scrollbar-width: thin; scrollbar-color: var(--line-3) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-3); border-radius: 6px; border: 2px solid var(--bg-1); }
::-webkit-scrollbar-track { background: transparent; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  grid-template-rows: var(--top) minmax(0, 1fr) var(--status);
  grid-template-areas: "top top" "rail main" "status status";
}

/* ---------- Command bar ---------- */
.topbar {
  grid-area: top;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 12px 0 0;
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
  min-width: 0;
}
.mark {
  width: var(--rail);
  height: 100%;
  display: grid;
  place-items: center;
  border-right: 1px solid var(--line);
  flex: none;
}
.mark svg { display: block; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; white-space: nowrap; }
.brand b {
  font: 800 14px/1 var(--f-mark);
  font-variation-settings: "wdth" 125;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.brand span { font: 500 var(--t-sm) var(--f-cond); color: var(--fg-2); letter-spacing: .04em; }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--fg-2); font-size: var(--t-sm); min-width: 0; white-space: nowrap; overflow: hidden; }
.crumbs b { color: var(--fg-0); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.omni {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  width: min(360px, 34vw);
  height: 30px;
  padding: 0 8px 0 10px;
  border: 1px solid var(--line-3);
  border-radius: var(--r);
  background: var(--bg-2);
  color: var(--fg-2);
  cursor: pointer;
  text-align: left;
}
.omni:hover { border-color: var(--accent-line); color: var(--fg-1); }
.omni span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.feed {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  font: 500 var(--t-xs) var(--f-mono);
  color: var(--fg-1);
  white-space: nowrap;
}
.feed i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); flex: none; }
.feed[data-s="live"] i { background: var(--buy); box-shadow: 0 0 0 3px var(--buy-bg); }
.feed[data-s="running"] i { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.feed[data-s="error"] i { background: var(--sell); }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- Rail ---------- */
.rail {
  grid-area: rail;
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 6px 0;
  gap: 2px;
}
.rail button {
  position: relative;
  height: 44px;
  border: 0;
  background: none;
  color: var(--fg-2);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.rail button:hover { color: var(--fg-0); background: var(--bg-2); }
.rail button[aria-current="page"] { color: var(--fg-0); }
.rail button[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--accent); }
.rail .rail-label { display: none; }
.rail .spacer { flex: 1; }

/* ---------- Main ---------- */
.main { grid-area: main; min-width: 0; min-height: 0; overflow: auto; position: relative; }
.view { padding: 14px 16px 24px; display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.view-h { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
.view-h h1 { font: 600 var(--t-xl)/1.15 var(--f-ui); letter-spacing: -.01em; }
.view-h p { color: var(--fg-2); font-size: var(--t-sm); margin-top: 3px; max-width: 80ch; }
.view-h .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* ---------- Status bar ---------- */
.statusbar {
  grid-area: status;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 12px;
  background: var(--bg-1);
  border-top: 1px solid var(--line);
  font: 400 var(--t-xs) var(--f-mono);
  color: var(--fg-2);
  white-space: nowrap;
  overflow: hidden;
}
.statusbar .sep { flex: 1; }
.statusbar b { color: var(--fg-1); font-weight: 500; }
.statusbar button { border: 0; background: none; color: var(--fg-2); font: inherit; cursor: pointer; padding: 0; }
.statusbar button:hover { color: var(--fg-0); }

/* ---------- Narrow screens: rail becomes a bottom bar ---------- */
@media (max-width: 760px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: var(--top) minmax(0, 1fr) calc(52px + env(safe-area-inset-bottom, 0px));
    grid-template-areas: "top" "main" "rail";
  }
  .statusbar { display: none; }
  .rail { flex-direction: row; padding: 0 0 env(safe-area-inset-bottom, 0px); border-right: 0; border-top: 1px solid var(--line); overflow-x: auto; }
  .rail button { flex: 1 0 52px; height: 52px; }
  .rail button[aria-current="page"]::before { left: 10px; right: 10px; top: 0; bottom: auto; width: auto; height: 2px; }
  .rail .spacer { display: none; }
  .brand, .crumbs { display: none; }
  .topbar { gap: 8px; padding-right: 8px; overflow: hidden; }
  .omni { width: auto; flex: 1; margin-left: 4px; }
  .omni kbd { display: none; }
  .feed .feed-t { display: none; }
  .view { padding: 12px 16px 20px; }
}

/* ---------- Panels ---------- */
.panel { background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; display: flex; flex-direction: column; }
.panel-h {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 34px;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
  border-radius: var(--r) var(--r) 0 0;
}
.panel-h h2, .panel-h h3 { font: 600 var(--t-xs)/1.2 var(--f-cond); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-1); }
.panel-h .src { font: 400 var(--t-xs) var(--f-mono); color: var(--fg-3); }
.panel-h .grow { flex: 1; }
.panel-b { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel-b.flush { padding: 0; }

/* ---------- Buttons and inputs ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border: 1px solid var(--line-3);
  border-radius: var(--r);
  background: var(--bg-3);
  color: var(--fg-0);
  font: 500 var(--t-sm) var(--f-ui);
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--fg-3); background: var(--bg-4); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.btn.ghost { background: none; border-color: transparent; color: var(--fg-1); }
.btn.ghost:hover { background: var(--bg-3); color: var(--fg-0); }
.btn.on { background: var(--accent-bg); border-color: var(--accent-line); color: var(--accent-hi); }
.btn.sm { height: 24px; padding: 0 8px; font-size: var(--t-xs); }
.btn svg { flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line-3); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--bg-2); color: var(--fg-2); font: 500 var(--t-xs) var(--f-mono); height: 26px; padding: 0 10px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line-3); }
.seg button:hover { color: var(--fg-0); }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent-hi); }
.input, select.input {
  height: 28px;
  padding: 0 8px;
  border: 1px solid var(--line-3);
  border-radius: var(--r);
  background: var(--bg-0);
  color: var(--fg-0);
  min-width: 0;
}
.input:focus { border-color: var(--accent); outline: none; }
textarea.input { height: auto; padding: 6px 8px; resize: vertical; line-height: 1.45; }
.check { display: flex; align-items: center; gap: 8px; color: var(--fg-1); cursor: pointer; font-size: var(--t-sm); }
.check input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
input[type=range] { accent-color: var(--accent); width: 100%; }
kbd {
  font: 500 10px/1 var(--f-mono);
  color: var(--fg-2);
  border: 1px solid var(--line-3);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 2px 4px;
  background: var(--bg-2);
}

/* ---------- Chips ---------- */
.tier {
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 3px;
  font: 700 11px/1 var(--f-mono);
  flex: none;
}
.tier[data-t="A"] { background: var(--accent); color: var(--on-accent); }
.tier[data-t="B"] { background: var(--accent-bg); color: var(--accent-hi); box-shadow: inset 0 0 0 1px var(--accent-line); }
.tier[data-t="C"] { background: var(--bg-3); color: var(--fg-1); box-shadow: inset 0 0 0 1px var(--line-3); }
.tier[data-t="D"] { background: none; color: var(--fg-3); box-shadow: inset 0 0 0 1px var(--line); }
.tier.lg { width: 30px; height: 30px; font-size: 15px; border-radius: 4px; }
.flags { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.flag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 7px;
  border-radius: 3px;
  font: 500 var(--t-xs)/1 var(--f-ui);
  white-space: nowrap;
  cursor: help;
}
.flag::before { content: ""; width: 5px; height: 5px; border-radius: 1px; flex: none; }
.flag[data-tone="pos"] { background: var(--buy-bg); color: #8FE3C0; }
.flag[data-tone="pos"]::before { background: var(--buy); }
.flag[data-tone="warn"] { background: var(--warn-bg); color: #F1CB86; }
.flag[data-tone="warn"]::before { background: var(--warn); transform: rotate(45deg); }
.flag[data-tone="info"] { background: var(--info-bg); color: var(--fg-1); }
.flag[data-tone="info"]::before { background: var(--info); border-radius: 50%; }
.flag.more { background: none; color: var(--fg-2); padding: 0 2px; }
.flag.more::before { display: none; }
.role {
  display: inline-block;
  font: 600 10px/1 var(--f-cond);
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 3px 5px;
  border-radius: 2px;
  background: var(--bg-3);
  color: var(--fg-1);
  white-space: nowrap;
}
.role[data-r="csuite"] { background: rgba(31, 158, 144, .18); color: #7FDDD1; }
.role[data-r="fund"], .role[data-r="holder"] { background: rgba(140, 108, 240, .16); color: #C2B2FB; }
.party { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 2px; font: 700 10px/1 var(--f-mono); background: var(--bg-3); color: var(--fg-1); flex: none; }
.new-badge { font: 700 9px/1 var(--f-mono); letter-spacing: .06em; color: var(--on-accent); background: var(--accent); padding: 2px 4px; border-radius: 2px; }
.side { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

/* ---------- KPI strip ---------- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r); }
.kpi { padding: 10px 14px 11px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--line); }
.kpi .v { font: 500 var(--t-xl)/1.1 var(--f-ui); letter-spacing: -.01em; }
.kpi .s { font-size: var(--t-xs); color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi:nth-child(4) { border-left: 0; }
  .kpi:nth-child(n+4) { border-top: 1px solid var(--line); }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(odd) { border-left: 0; }
  .kpi:nth-child(4) { border-left: 1px solid var(--line); }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
}

/* ---------- Tables ---------- */
.table-wrap { overflow: auto; min-width: 0; }
table.grid { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--t-sm); }
.grid th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--bg-2);
  text-align: left;
  font: 600 10.5px/1.2 var(--f-cond);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--fg-2);
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  user-select: none;
}
.grid th.sortable { cursor: pointer; }
.grid th.sortable:hover { color: var(--fg-0); }
.grid th[aria-sort] { color: var(--accent-hi); }
.grid th.num, .grid td.num { text-align: right; }
.grid td { padding: 7px 9px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.score-mix { display: flex; flex-direction: column; gap: 5px; }
.act { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.grid tbody tr { cursor: default; }
.grid tbody tr:hover td { background: var(--bg-2); }
.grid tbody tr[aria-selected="true"] td { background: var(--accent-bg); }
.grid tbody tr[aria-selected="true"] td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.grid .tk { font: 600 var(--t-md) var(--f-mono); color: var(--fg-0); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.grid .tk:hover { color: var(--accent-hi); }
.grid .co { font-size: var(--t-xs); color: var(--fg-2); max-width: 17ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grid .co:empty { display: none; }
.grid .two { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; }
.grid .two .sub { font-size: var(--t-xs); color: var(--fg-2); white-space: nowrap; max-width: 20ch; overflow: hidden; text-overflow: ellipsis; }
.cell-row { display: flex; align-items: center; gap: 8px; min-width: 0; }

/* ---------- Meter / score ---------- */
.score { display: inline-flex; align-items: center; gap: 8px; }
.score b { font: 600 var(--t-md) var(--f-mono); min-width: 2ch; text-align: right; }
.meter { position: relative; width: 56px; height: 4px; background: var(--bg-4); border-radius: 2px; overflow: hidden; flex: none; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; }
.stackbar { display: flex; width: 96px; height: 6px; gap: 1px; background: var(--bg-4); border-radius: 1px; overflow: hidden; flex: none; }
.stackbar i { display: block; height: 100%; }
.stackbar i[data-g="insider"] { background: var(--grp-insider); }
.stackbar i[data-g="congress"] { background: var(--grp-congress); }
.stackbar i[data-g="cross"] { background: var(--grp-cross); }

/* ---------- States ---------- */
.empty { padding: 28px 18px; display: flex; flex-direction: column; gap: 6px; color: var(--fg-1); max-width: 70ch; }
.empty h3 { font: 600 var(--t-lg) var(--f-ui); color: var(--fg-0); }
.alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--r); border: 1px solid; font-size: var(--t-sm); }
.alert b { display: block; font-weight: 600; }
.alert[data-tone="error"] { background: var(--sell-bg); border-color: rgba(240, 86, 63, .35); color: #FFC2B8; }
.alert[data-tone="warn"] { background: var(--warn-bg); border-color: rgba(217, 161, 59, .35); color: #F1CB86; }
.alert[data-tone="info"] { background: var(--accent-bg); border-color: var(--accent-line); color: var(--fg-0); }
.skel { height: 10px; border-radius: 2px; background: linear-gradient(90deg, var(--bg-3), var(--bg-4), var(--bg-3)); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- Lists ---------- */
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rows li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-2); min-width: 0; }
.rows li:last-child { border-bottom: 0; }
.rows .grow { flex: 1; min-width: 0; }
.rows .t1 { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .t2 { font-size: var(--t-xs); color: var(--fg-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: var(--t-sm); }
.kv dt { color: var(--fg-2); }
.kv dd { margin: 0; font-family: var(--f-mono); text-align: right; }
.linkish { border: 0; background: none; padding: 0; color: var(--fg-0); cursor: pointer; text-align: left; font: inherit; }
.linkish:hover { color: var(--accent-hi); text-decoration: underline; }

/* ---------- Overlays ---------- */
